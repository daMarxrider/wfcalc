name: GitHub Pages

# Builds the static version (tools/build-pages.ts) and publishes it on every push to main, once the tests pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A red main must not go live.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The artwork ships with the site; the cache keeps the build from refetching ~3,600 images.
      - uses: actions/cache@v4
        with:
          path: |
            data/img
            data/cards
          key: art-${{ hashFiles('data/snapshot.json') }}
          restore-keys: art-
      - run: node tools/build-pages.ts --art
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
